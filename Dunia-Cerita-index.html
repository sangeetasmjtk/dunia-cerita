<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dunia Cerita</title>
<style>
:root{color-scheme:light dark;--bg:#fff9f0;--surface:#fff;--ink:#332b2b;--muted:#756b68;--accent:#ff8f70;--accent2:#ffd166;--line:#eadfd5;--shadow:0 14px 35px rgba(78,52,40,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{min-height:100vh;background:light-dark(#fff9f0,#211d1b);border-radius:0}header{padding:24px max(22px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px} .brand{display:flex;gap:12px;align-items:center;font-weight:900;font-size:24px}.logo{width:48px;height:48px;border-radius:16px;background:var(--accent2);display:grid;place-items:center;font-size:27px;box-shadow:0 7px 0 #e9b74e}.pill{border:1px solid var(--line);padding:9px 14px;border-radius:999px;background:var(--surface);font-weight:700;color:var(--muted)}
.hero{max-width:1120px;margin:10px auto 30px;padding:38px 30px;border-radius:30px;background:linear-gradient(135deg,#ffe8bd,#ffd7d1);box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr .8fr;align-items:center;overflow:hidden}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1;margin:0 0 14px}.hero p{font-size:18px;max-width:600px;color:#5f514d}.hero-art{font-size:120px;text-align:center;filter:drop-shadow(0 12px 8px rgba(100,60,40,.13))}.hero-badge{display:inline-block;margin-bottom:12px;padding:8px 12px;border-radius:999px;background:#fff8;color:#6d5145;font-weight:900}
main{max-width:1120px;margin:auto;padding:0 22px 60px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}input{flex:1;min-width:220px;padding:14px 17px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font-size:15px;outline:none}.cats{display:flex;gap:9px;flex-wrap:wrap}.cat{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:700}.cat.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}h2{margin:30px 0 15px;font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.18s transform}.card:hover{transform:translateY(-4px)}.cover{height:175px;display:grid;place-items:center;font-size:78px;background:linear-gradient(145deg,#e7f4ff,#fff0cf)}.card:nth-child(2) .cover{background:linear-gradient(145deg,#e9ddff,#dff8ec)}.card:nth-child(3) .cover{background:linear-gradient(145deg,#ffe1e8,#fff1bd)}.info{padding:18px}.tag{font-size:12px;font-weight:800;color:#b65d47;text-transform:uppercase;letter-spacing:.06em}.info h3{margin:7px 0;font-size:20px}.info p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}.read{display:block;margin-top:13px;color:var(--ink);font-weight:900}
.reader{display:none;max-width:820px;margin:30px auto;padding:0 22px 60px}.back{border:0;background:transparent;font-weight:800;color:var(--muted);cursor:pointer;padding:8px 0;font-size:15px}.book{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:35px 30px}.book-art{text-align:center;font-size:100px;margin:10px 0}.book h2{font-size:32px;margin:8px 0}.page{font-size:20px;line-height:1.8;color:#554b48;min-height:210px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:10px}.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--ink);color:var(--bg);font-weight:800;cursor:pointer}.btn:disabled{opacity:.35;cursor:not-allowed}.progress{font-size:13px;color:var(--muted);font-weight:700}.reader-tools{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.tool{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer}.tool.on{background:#fff0c7}.quiz{display:none;margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#fff8df,#eef8ff)}.quiz h3{margin:0 0 8px}.quiz button{margin:6px 5px 0 0}.quiz-result{font-weight:800;margin-top:10px}
@media(max-width:760px){header{padding:18px}.hero{margin:5px 15px 25px;grid-template-columns:1fr;padding:28px 22px}.hero-art{font-size:80px}.grid{grid-template-columns:1fr}.book{padding:25px 20px}.page{font-size:18px}.controls{flex-wrap:wrap}.controls .progress{order:-1;width:100%;text-align:center}}
@media(prefers-color-scheme:dark){:root{--bg:#211d1b;--surface:#2c2725;--ink:#fff5ed;--muted:#c4b8b0;--line:#4b413c;--shadow:0 14px 35px rgba(0,0,0,.25)}.hero{background:linear-gradient(135deg,#55402a,#503538)}.hero p{color:#e4d5cd}.cover{background:linear-gradient(145deg,#283a45,#4b4030)!important}}
</style></head>
<body><div id="app">
<header><div class="brand"><div class="logo">📖</div>Dunia Cerita</div><div class="pill">✨ Cerita untuk dibaca</div></header>
<section class="hero"><div><span class="hero-badge">🌟 Koleksi cerita anak</span><h1>Petualangan kecil,<br>imajinasi besar.</h1><p>Kumpulan cerita hangat untuk menemani waktu membaca. Pilih cerita dan mulai petualanganmu!</p></div><div class="hero-art">🦊🌙</div></section>
<main id="home"><div class="tools"><input id="search" placeholder="🔎 Cari cerita..."><div class="cats"><button class="cat active" data-cat="Semua">Semua</button><button class="cat" data-cat="Binatang">🐾 Binatang</button><button class="cat" data-cat="Fantasi">🧚 Fantasi</button><button class="cat" data-cat="Sahabat">❤️ Sahabat</button><button class="cat" data-cat="Favorit">⭐ Favorit</button></div></div><h2>Cerita pilihan</h2><div class="grid" id="grid"></div></main>
<section class="reader" id="reader"><button class="back" id="back">← Kembali ke daftar cerita</button><article class="book"><div class="book-art" id="art">🦊</div><div class="tag" id="tag"></div><h2 id="title"></h2><div class="page" id="page"></div><div class="controls"><button class="btn" id="prev">← Sebelumnya</button><span class="progress" id="progress"></span><button class="btn" id="next">Selanjutnya →</button></div><div class="reader-tools"><button class="tool" id="listen">🔊 Dengarkan</button><button class="tool" id="fav">☆ Favorit</button></div><div class="quiz" id="quiz"><h3>🧩 Kuis cerita</h3><div id="quizQuestion"></div><div id="quizOptions"></div><div class="quiz-result" id="quizResult"></div></div></article></section>
</div>
<script>
const stories=[
{id:1,cat:'Binatang',emoji:'🦊',title:'Rara dan Lentera Bulan',desc:'Seekor rubah kecil menemukan cahaya misterius di tengah hutan.',pages:['Malam itu, Rara si rubah kecil belum ingin tidur. Ia melihat cahaya keemasan berkelip di antara pepohonan.','Rara mengikuti cahaya itu sampai menemukan sebuah lentera kecil tergantung di dahan. Di bawahnya ada burung hantu yang tampak kebingungan.','"Lentera ini milikku, tetapi cahayanya terlalu redup," kata burung hantu. Rara lalu mengajak teman-temannya mencari bunga-bunga yang bisa memantulkan cahaya bulan.','Mereka bekerja bersama. Ketika bunga-bunga itu diletakkan di sekitar lentera, hutan menjadi terang dan indah. Sejak malam itu, Rara tahu bahwa masalah terasa lebih ringan ketika dikerjakan bersama.']},
{id:2,cat:'Fantasi',emoji:'🧚',title:'Lumi dan Taman Awan',desc:'Peri kecil yang belajar bahwa keberanian tidak harus berarti tidak takut.',pages:['Lumi tinggal di sebuah taman yang berada di atas awan. Ia sangat ingin melihat pelangi dari dekat, tetapi jembatan awan membuatnya takut.','Suatu pagi, warna-warna pelangi mulai memudar. Lumi tahu ia harus mengantarkan kristal cahaya ke ujung taman.','Lumi menarik napas panjang dan melangkah perlahan. Ia masih takut, tetapi ia terus berjalan. Setiap langkah membuatnya semakin percaya diri.','Saat kristal dipasang, pelangi kembali bersinar. Lumi tersenyum. Ternyata berani bukan berarti tidak takut—berani berarti tetap mencoba.']},
{id:3,cat:'Sahabat',emoji:'🐻',title:'Bimo Belajar Berbagi',desc:'Seekor beruang menemukan bahwa kebahagiaan bisa menjadi lebih besar saat dibagikan.',pages:['Bimo menemukan satu keranjang buah beri yang sangat manis. Ia ingin memakannya sendiri.','Tidak jauh dari sana, sahabatnya, Kiki, sedang mencari makanan untuk keluarganya. Bimo ragu sejenak.','Akhirnya Bimo membagi buah beri itu. Mereka duduk bersama sambil bercerita dan tertawa.','Bimo terkejut. Buahnya memang menjadi lebih sedikit, tetapi rasa bahagianya justru bertambah banyak.']},
{id:4,cat:'Binatang',emoji:'🐰',title:'Nino dan Hujan Pelangi',desc:'Kelinci kecil membantu teman-temannya menemukan jalan pulang setelah hujan.',pages:['Nino sedang bermain di padang rumput ketika hujan turun. Setelah hujan reda, muncul pelangi besar.','Beberapa anak tupai kebingungan mencari jalan pulang karena jejak mereka tertutup genangan.','Nino mengajak mereka mengikuti pelangi sebagai petunjuk arah. Mereka berjalan bersama sambil menghitung warna pelangi.','Akhirnya mereka sampai di rumah. Nino belajar bahwa menjadi penunjuk jalan terasa menyenangkan jika dilakukan bersama.']},
{id:5,cat:'Fantasi',emoji:'🐉',title:'Naga Kecil yang Takut Api',desc:'Seekor naga belajar bahwa setiap orang boleh belajar dengan caranya sendiri.',pages:['Dara adalah naga kecil yang belum bisa mengeluarkan api. Ia merasa berbeda dari naga lain.','Guru naga menyuruh semua murid berlatih, tetapi Dara memilih mulai dari menghangatkan telapak tangannya.','Hari demi hari Dara berlatih sedikit demi sedikit. Suatu pagi, muncul percikan kecil yang membuat semua orang bersorak.','Dara tersenyum. Ia tidak harus menjadi seperti naga lain untuk menjadi hebat.']},
{id:6,cat:'Sahabat',emoji:'🐱',title:'Mimi dan Payung Kuning',desc:'Dua sahabat menemukan cara sederhana untuk menolong satu sama lain.',pages:['Mimi membawa payung kuning ke sekolah karena langit terlihat mendung.','Saat pulang, hujan turun deras dan Lala lupa membawa payung. Mimi mengajaknya berjalan bersama.','Payung itu kecil, jadi mereka harus berjalan berdekatan dan melangkah pelan.','Mereka tiba di rumah sambil tertawa. Ternyata berbagi ruang sedikit bisa membuat perjalanan jauh lebih menyenangkan.']},
{id:7,cat:'Binatang',emoji:'🦉',title:'Owi Mencari Bintang',desc:'Burung hantu kecil mencari bintang paling terang untuk memberi semangat pada temannya.',pages:['Owi melihat seekor anak landak yang sedang murung. Ia ingin memberikan hadiah yang istimewa.','Owi terbang tinggi mencari bintang yang paling terang, tetapi semua bintang terlihat indah.','Ia akhirnya membawa daun berkilau yang terkena cahaya bulan.','Anak landak tersenyum. Owi sadar bahwa hadiah terbaik adalah perhatian yang tulus.']},
{id:8,cat:'Fantasi',emoji:'🌈',title:'Kota di Balik Pelangi',desc:'Maya menemukan kota kecil yang hanya muncul ketika pelangi datang.',pages:['Maya melihat pintu kecil di ujung pelangi. Ketika dibuka, ia menemukan kota penuh rumah warna-warni.','Penduduk kota sedang sibuk memperbaiki lonceng pelangi yang berhenti berbunyi.','Maya membantu mencari batu kristal yang hilang di taman.','Lonceng kembali berbunyi. Sebelum pulang, Maya tahu bahwa petualangan terbaik sering dimulai dari rasa ingin tahu.']},
{id:9,cat:'Sahabat',emoji:'🐶',title:'Piko dan Kotak Rahasia',desc:'Piko belajar bahwa rahasia kecil bisa menjadi kejutan yang menyenangkan.',pages:['Piko menemukan kotak kayu di bawah bangku taman. Ia mengajak sahabatnya, Rani, untuk membukanya bersama.','Di dalamnya ada kartu-kartu kosong dan pensil warna. Mereka memutuskan membuat pesan baik untuk orang lain.','Mereka meninggalkan kartu di taman untuk siapa saja yang menemukannya.','Hari berikutnya, taman dipenuhi pesan ceria. Kotak rahasia itu ternyata menyimpan cara sederhana untuk berbagi kebaikan.']},
{id:10,cat:'Binatang',emoji:'🐢',title:'Toto Tidak Terburu-buru',desc:'Kura-kura kecil menunjukkan bahwa berjalan pelan juga bisa membawa kita jauh.',pages:['Toto selalu menjadi yang paling lambat ketika bermain bersama teman-temannya.','Suatu hari, mereka berlomba menuju pohon mangga. Toto tidak berlari, tetapi terus berjalan tanpa berhenti.','Teman-temannya berhenti berkali-kali karena lelah. Toto tetap melangkah dengan tenang.','Akhirnya Toto tiba di pohon. Ia belajar bahwa konsisten bisa sama pentingnya dengan cepat.']},
{id:11,cat:'Fantasi',emoji:'🪄',title:'Tongkat Ajaib Lila',desc:'Lila menemukan bahwa sihir paling kuat adalah menggunakan kemampuan untuk membantu.',pages:['Lila mendapat tongkat ajaib yang bisa mengubah satu benda kecil setiap hari.','Ia ingin mengubah batu menjadi permata, tetapi melihat taman sekolah yang kekurangan air.','Lila menggunakan tongkatnya untuk membuat kendi kecil yang tidak pernah kosong.','Taman kembali hijau. Lila sadar bahwa kemampuan terasa lebih berarti ketika digunakan untuk kebaikan.']},
{id:12,cat:'Sahabat',emoji:'🐧',title:'Pinguin yang Kehilangan Sarung Tangan',desc:'Teman-teman membantu Pipi mencari barang kecil yang sangat berarti.',pages:['Pipi kehilangan satu sarung tangan kesayangannya saat bermain di salju.','Ia mencari sendiri, tetapi salju membuat semuanya terlihat putih.','Teman-temannya membentuk barisan dan mencari bersama-sama.','Mereka menemukan sarung tangan itu di dekat pohon es. Pipi berterima kasih karena tidak sendirian.']},
{id:13,cat:'Binatang',emoji:'🦁',title:'Leo Belajar Mendengar',desc:'Singa kecil menemukan bahwa menjadi teman yang baik juga berarti mau mendengarkan.',pages:['Leo suka bercerita dan sering lupa memberi kesempatan kepada teman-temannya untuk bicara.','Suatu sore, Sasa ingin bercerita tentang rumah barunya. Leo hampir menyela, tetapi ia mencoba mendengarkan sampai selesai.','Leo mengetahui bahwa cerita Sasa ternyata sangat menarik.','Sejak itu Leo belajar bahwa mendengarkan adalah cara lain untuk menunjukkan bahwa kita peduli.']},
{id:14,cat:'Fantasi',emoji:'☁️',title:'Kereta Awan',desc:'Sebuah kereta ajaib membawa Riko melihat tempat-tempat yang belum pernah ia bayangkan.',pages:['Riko menemukan tiket kereta di dalam buku. Ketika ia membacanya, sebuah kereta awan muncul di jendela.','Kereta itu membawanya melewati gunung permen dan danau bintang.','Riko bertemu penjaga awan yang mengajarinya melihat bentuk-bentuk unik di langit.','Ketika pulang, Riko menyimpan tiket itu di bukunya sebagai kenangan petualangan.']},
{id:15,cat:'Sahabat',emoji:'🐼',title:'Panda dan Layang-Layang',desc:'Panda kecil dan temannya bekerja sama membuat layang-layang pertama mereka.',pages:['Panda ingin membuat layang-layang, tetapi tidak tahu cara memasang ekornya.','Temannya, Uli, membantu memegang tali sementara Panda memperbaiki rangkanya.','Layang-layang mereka sempat jatuh, tetapi mereka mencoba lagi.','Kali ini layang-layang terbang tinggi. Mereka belajar bahwa kesalahan bisa menjadi bagian dari proses belajar.']}
];
let selected='Semua', filtered=stories, story=null, page=0, favorites=JSON.parse(localStorage.getItem('duniaCeritaFav')||'[]');
const grid=document.getElementById('grid');
function render(){const q=document.getElementById('search').value.toLowerCase();filtered=stories.filter(s=>(selected==='Semua'||selected===s.cat||(selected==='Favorit'&&favorites.includes(s.id)))&&(s.title+' '+s.desc).toLowerCase().includes(q));grid.innerHTML=filtered.map(s=>`<article class="card" data-id="${s.id}"><div class="cover">${s.emoji}</div><div class="info"><div class="tag">${s.cat} ${favorites.includes(s.id)?'⭐':''}</div><h3>${s.title}</h3><p>${s.desc}</p><span class="read">Baca cerita →</span></div></article>`).join('')||'<p>Belum ada cerita yang cocok. Coba kata kunci lain.</p>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openStory(+c.dataset.id));}
function openStory(id){story=stories.find(s=>s.id===id);page=0;document.getElementById('home').style.display='none';document.querySelector('header').style.display='none';document.querySelector('.hero').style.display='none';document.getElementById('reader').style.display='block';updatePage();scrollTo({top:0,behavior:'smooth'});}
function updatePage(){document.getElementById('art').textContent=story.emoji;document.getElementById('tag').textContent=story.cat;document.getElementById('title').textContent=story.title;document.getElementById('page').textContent=story.pages[page];document.getElementById('progress').textContent=`Halaman ${page+1} dari ${story.pages.length}`;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===story.pages.length-1;document.getElementById('fav').textContent=favorites.includes(story.id)?'★ Favorit':'☆ Favorit';document.getElementById('quiz').style.display=page===story.pages.length-1?'block':'none';if(page===story.pages.length-1)renderQuiz();}
function renderQuiz(){const quiz={1:['Apa yang dilakukan Rara untuk membantu lentera?',['Mencari bunga yang memantulkan cahaya','Membawa lentera ke sungai','Tidur di bawah pohon','Membuat jembatan'],0],2:['Apa yang harus Lumi antarkan?',['Kristal cahaya','Payung kuning','Keranjang beri','Layang-layang'],0],3:['Apa pelajaran utama Bimo?',['Berbagi dapat menambah kebahagiaan','Bermain harus sendirian','Buah beri harus disimpan','Teman tidak perlu dibantu'],0]}[story.id];if(!quiz){document.getElementById('quiz').style.display='none';return}document.getElementById('quizQuestion').textContent=quiz[0];document.getElementById('quizOptions').innerHTML=quiz[1].map((o,i)=>`<button class="tool" onclick="answerQuiz(${i},${quiz[2]})">${o}</button>`).join('');document.getElementById('quizResult').textContent='';}
function answerQuiz(i,correct){document.getElementById('quizResult').textContent=i===correct?'🎉 Benar! Hebat!':'😊 Belum tepat. Coba ingat lagi isi ceritanya.';}
document.getElementById('next').onclick=()=>{if(page<story.pages.length-1){page++;updatePage()}};document.getElementById('prev').onclick=()=>{if(page>0){page--;updatePage()}};document.getElementById('back').onclick=()=>{document.getElementById('reader').style.display='none';document.getElementById('home').style.display='block';document.querySelector('header').style.display='flex';document.querySelector('.hero').style.display='grid';speechSynthesis.cancel();scrollTo({top:0,behavior:'smooth'})};document.getElementById('search').oninput=render;document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});render();
document.getElementById('listen').onclick=()=>{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(story.pages[page]);u.lang='id-ID';speechSynthesis.speak(u)}};document.getElementById('fav').onclick=()=>{favorites=favorites.includes(story.id)?favorites.filter(id=>id!==story.id):[...favorites,story.id];localStorage.setItem('duniaCeritaFav',JSON.stringify(favorites));updatePage();render()};
</script></body></html>
